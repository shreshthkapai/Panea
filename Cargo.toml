[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/ios",
    "crates/assets",
    "crates/config-core",
    "crates/config-lua",
    "crates/config-toml",
    "crates/diagnostics",
    "crates/font-system",
    "crates/mux",
    "crates/platform-core",
    "crates/platform-winit",
    "crates/render-core",
    "crates/render-wgpu",
    "crates/security",
    "crates/semantics",
    "crates/shell-integration",
    "crates/term-core",
    "crates/term-parser",
    "crates/transport-core",
    "crates/transport-pty",
    "crates/transport-ssh",
    "tools/bench",
    "tools/windows-installer",
    "tools/xtask",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shreshthkapai/Panea"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
ab_glyph = "0.2"
arboard = { version = "3", features = ["wayland-data-control"] }
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "png"] }
keyring = "4.1"
notify-rust = "4.18"
rustybuzz = "0.20"
swash = "0.2"
pollster = "0.4"
portable-pty = "0.9.0"
proptest = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = "0.9"
starship-battery = "0.11.1"
toml = "0.8"
unicode-width = "0.2"
unicode-segmentation = "1.12"
wgpu = "0.20"
winit = "0.30.13"
webbrowser = "1"
zeroize = "1"
