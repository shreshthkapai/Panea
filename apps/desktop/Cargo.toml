[package]
name = "panea-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[features]
windows-gui = []

[lib]
path = "src/main.rs"

[[bin]]
name = "panea"
path = "src/cli_main.rs"

[[bin]]
name = "panea-gui"
path = "src/gui_main.rs"
required-features = ["windows-gui"]

[lints]
workspace = true

[dependencies]
config-core = { path = "../../crates/config-core" }
config-lua = { path = "../../crates/config-lua" }
config-toml = { path = "../../crates/config-toml" }
diagnostics = { path = "../../crates/diagnostics" }
font-system = { path = "../../crates/font-system" }
image.workspace = true
mux = { path = "../../crates/mux" }
platform-core = { path = "../../crates/platform-core" }
platform-winit = { path = "../../crates/platform-winit" }
pollster.workspace = true
render-core = { path = "../../crates/render-core" }
render-wgpu = { path = "../../crates/render-wgpu" }
security = { path = "../../crates/security" }
serde_json.workspace = true
semantics = { path = "../../crates/semantics" }
shell-integration = { path = "../../crates/shell-integration" }
term-core = { path = "../../crates/term-core" }
term-parser = { path = "../../crates/term-parser" }
transport-core = { path = "../../crates/transport-core" }
transport-pty = { path = "../../crates/transport-pty" }
transport-ssh = { path = "../../crates/transport-ssh" }
unicode-segmentation.workspace = true
unicode-width.workspace = true
winit.workspace = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
