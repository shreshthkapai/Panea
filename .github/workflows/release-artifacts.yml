name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: linux-x11
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-dri \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            rpm \
            xauth \
            xvfb
          curl -L --fail --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGN_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\panea-signing.pfx", [Convert]::FromBase64String("$env:WINDOWS_SIGN_CERTIFICATE_BASE64"))
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE_BASE64 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Configure macOS notarization profile
        if: runner.os == 'macOS' && env.MACOS_NOTARY_APPLE_ID != ''
        run: >
          xcrun notarytool store-credentials panea-release
          --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}"
          --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}"
          --password "${{ secrets.MACOS_NOTARY_PASSWORD }}"
      - name: Build release distributions
        env:
          PANEA_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && vars.PANEA_ALLOW_UNSIGNED_RELEASES != 'true' && '1' || '0' }}
          PANEA_WINDOWS_SIGN_CERTIFICATE: ${{ runner.os == 'Windows' && env.WINDOWS_SIGN_CERTIFICATE_BASE64 != '' && format('{0}\panea-signing.pfx', runner.temp) || '' }}
          PANEA_WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
          PANEA_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          PANEA_MACOS_NOTARY_PROFILE: ${{ env.MACOS_NOTARY_APPLE_ID != '' && 'panea-release' || '' }}
          PANEA_APPIMAGETOOL: ${{ runner.os == 'Linux' && format('{0}/appimagetool', runner.temp) || '' }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >
          cargo run -p xtask -- package build
          --target-platform ${{ matrix.target }}
          --profile release
      - name: Smoke staged release
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          WINIT_UNIX_BACKEND: x11
          XDG_SESSION_TYPE: x11
        shell: bash
        if: runner.os == 'Linux'
        run: >
          xvfb-run -a cargo run -p xtask -- package smoke
          --target-platform ${{ matrix.target }}
          --profile release
          --timeout-ms 15000
      - name: Smoke staged release
        if: runner.os != 'Linux'
        run: >
          cargo run -p xtask -- package smoke
          --target-platform ${{ matrix.target }}
          --profile release
          --timeout-ms 15000
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panea-${{ matrix.target }}
          path: target/packages/
          if-no-files-found: error

  performance-contract:
    name: performance contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and measure representative renderer path
        run: cargo run --release -p panea-bench -- render-grid
      - name: Verify disabled/default/heavy cursor budgets
        run: cargo run --release -p panea-bench -- cursor-animation

  publish-release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, performance-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download packaged distributions
        uses: actions/download-artifact@v4
        with:
          pattern: panea-*
          path: release-assets
      - name: Collect public release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir public-assets
          expected_version="${GITHUB_REF_NAME#v}"
          found=0
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ "$name" != panea-"$expected_version"-* ]]; then
              echo "release filename '$name' does not match tag '$GITHUB_REF_NAME'" >&2
              exit 1
            fi
            if [[ -e "public-assets/$name" ]]; then
              echo "duplicate release filename '$name'" >&2
              exit 1
            fi
            cp "$asset" "public-assets/$name"
            found=1
          done < <(find release-assets -mindepth 2 -maxdepth 2 -type f -print0)
          if [[ "$found" -ne 1 ]]; then
            echo "no public release files were downloaded" >&2
            exit 1
          fi
      - name: Attest release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: public-assets/*
      - name: Write release notes
        shell: bash
        env:
          PANEA_ALLOW_UNSIGNED_RELEASES: ${{ vars.PANEA_ALLOW_UNSIGNED_RELEASES }}
        run: |
          cat > release-notes.md <<'EOF'
          Panea release artifacts are built and smoke-tested on their native operating systems. Verify the bundled SHA-256 checksums or GitHub artifact attestations before installation.
          EOF
          if [[ "$PANEA_ALLOW_UNSIGNED_RELEASES" == "true" ]]; then
            cat >> release-notes.md <<'EOF'

          **Signing notice:** Windows and macOS artifacts are unsigned for this release. Windows SmartScreen or macOS Gatekeeper may warn before launch. This is an explicit temporary release policy, not a verification failure.
          EOF
          fi
      - name: Publish immutable tag release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" public-assets/* \
            --verify-tag \
            --title "Panea $GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file release-notes.md
