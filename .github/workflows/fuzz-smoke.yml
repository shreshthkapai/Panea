name: fuzz-smoke

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

jobs:
  fuzz-smoke:
    name: fuzz smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run parser/core/shell fuzz property smoke tests
        run: cargo run -p xtask -- fuzz-smoke
      - name: Enforce parser throughput regression floor
        run: cargo run --release -p panea-bench -- parser-throughput
