[package]
name = "panea-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Repeatable local benchmark runner and fixtures for Panea."

[[bin]]
name = "panea-bench"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
config-core = { path = "../../crates/config-core" }
diagnostics = { path = "../../crates/diagnostics" }
font-system = { path = "../../crates/font-system" }
render-core = { path = "../../crates/render-core" }
render-wgpu = { path = "../../crates/render-wgpu", features = ["conformance"] }
semantics = { path = "../../crates/semantics" }
term-core = { path = "../../crates/term-core" }
term-parser = { path = "../../crates/term-parser" }
